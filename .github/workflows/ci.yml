name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Generated client matches the contract
        run: bun run api:check
      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e

  # The web against the real stock-flow-api and Postgres, one happy path (e2e-smoke/).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values, for a database that lives as long as this job.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      PORT: "8080"
      SMOKE_OWNER_EMAIL: owner@smoke.example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: thawatchaiUdjan/stock-flow-api
          ref: main
          path: stock-flow-api

      - name: The contract is the api's
        run: |
          if ! diff -u stock-flow-api/openapi.yaml openapi/openapi.yaml; then
            echo "::error::openapi/openapi.yaml differs from stock-flow-api's on main. Run 'bun run api:sync', regenerate the client with 'bun run api:generate', and commit both."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      # Caches the Go modules and the build cache by default.
      - uses: actions/setup-go@v7
        with:
          go-version-file: stock-flow-api/go.mod
          cache-dependency-path: stock-flow-api/go.sum

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Migrate the api's database
        working-directory: stock-flow-api
        run: go tool goose -dir db/migrations postgres "$POSTGRES_URL" up

      - name: Issue the Owner's Setup link
        working-directory: stock-flow-api
        run: |
          go run ./cmd/install -name "Smoke Owner" -email "$SMOKE_OWNER_EMAIL" > install.out
          token="$(tail -n 1 install.out)"
          echo "::add-mask::$token"
          echo "SMOKE_SETUP_LINK_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start the api
        working-directory: stock-flow-api
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-connrefused \
            http://localhost:8080/health

      - name: Smoke test
        env:
          API_PROXY_TARGET: http://localhost:8080
        run: bun run smoke

      - name: The api's log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
