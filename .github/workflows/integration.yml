name: API integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web against the real stock-flow-api and Postgres, one happy path (e2e-smoke/).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values, for a database that lives as long as this job.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      PORT: "8080"
      SMOKE_OWNER_EMAIL: owner@smoke.example
    steps:
      - uses: actions/checkout@v7
      - name: Read the adopted API commit
        id: contract
        run: >-
          node -e "const fs = require('node:fs');
          const { ref } = JSON.parse(fs.readFileSync('openapi/api-source.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(ref)) throw new Error('API ref must be a full commit SHA');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ref=' + ref + '\n');"
      - uses: actions/checkout@v7
        id: api
        with:
          repository: thawatchaiUdjan/stock-flow-api
          ref: ${{ steps.contract.outputs.ref }}
          path: stock-flow-api

      - name: The contract is the api's
        run: |
          if ! diff -u stock-flow-api/openapi.yaml openapi/openapi.yaml; then
            echo "::error::openapi/openapi.yaml differs from the pinned API commit. Run 'bun run api:sync', regenerate the client with 'bun run api:generate', and commit both."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      # The binaries depend only on the api's commit: a hit skips Go, and its caches, entirely.
      - name: Cache the api's binaries
        id: api-bin
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bin
          key: api-bin-${{ runner.os }}-${{ steps.api.outputs.commit }}

      # Caches the Go modules and the build cache by default.
      - uses: actions/setup-go@v7
        if: steps.api-bin.outputs.cache-hit != 'true'
        with:
          go-version-file: stock-flow-api/go.mod
          cache-dependency-path: stock-flow-api/go.sum

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # A miss installs the browser and its system packages; a hit needs only the browser's files,
      # which the cache restored (the runner image carries the shared libraries).
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # One build for the three tools, so the steps below run binaries, not the compiler.
      - name: Build the api, its installer and goose
        if: steps.api-bin.outputs.cache-hit != 'true'
        working-directory: stock-flow-api
        run: go build -o "$RUNNER_TEMP/bin/" github.com/pressly/goose/v3/cmd/goose ./cmd/api ./cmd/install

      - name: Migrate the api's database
        working-directory: stock-flow-api
        run: $RUNNER_TEMP/bin/goose -dir db/migrations postgres "$POSTGRES_URL" up

      - name: Issue the Owner's Setup link
        working-directory: stock-flow-api
        run: |
          "$RUNNER_TEMP/bin/install" -name "Smoke Owner" -email "$SMOKE_OWNER_EMAIL" > install.out
          token="$(tail -n 1 install.out)"
          echo "::add-mask::$token"
          echo "SMOKE_SETUP_LINK_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start the api
        working-directory: stock-flow-api
        run: |
          "$RUNNER_TEMP/bin/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-connrefused \
            http://localhost:8080/health

      - name: Smoke test
        env:
          API_PROXY_TARGET: http://localhost:8080
        run: bun run smoke

      - name: The api's log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
