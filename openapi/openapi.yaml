components:
  schemas:
    AdjustStockBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AdjustStockBody.json
          format: uri
          readOnly: true
          type: string
        change:
          description: "How many units to add (above 0) or take (below 0): a whole number other than 0."
          format: int32
          not:
            enum:
              - 0
            type: integer
          type: integer
        note:
          description: Why the stock is wrong, up to 200 characters.
          maxLength: 200
          pattern: "[^\\t-\\r \x85   - \u2028\u2029  　]"
          patternDescription: contain a character that is not whitespace
          type: string
        productId:
          description: The Product whose stock is wrong. It must be Active.
          format: int64
          type: integer
      required:
        - productId
        - change
        - note
      type: object
    CreateOrderBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateOrderBody.json
          format: uri
          readOnly: true
          type: string
        customer:
          description: The customer's name, up to 120 characters.
          maxLength: 120
          type: string
        lines:
          description: One or more lines, each a different Product. Each line's price is the Product's now.
          items:
            $ref: "#/components/schemas/CreateOrderLine"
          minItems: 1
          type: array
        note:
          description: Anything worth keeping about the Order, up to 200 characters.
          maxLength: 200
          type: string
      required:
        - lines
      type: object
    CreateOrderLine:
      additionalProperties: false
      properties:
        productId:
          description: The Product. It must be Active, and on no other line.
          format: int64
          type: integer
        quantity:
          description: "How many units: a whole number, at least 1."
          format: int32
          minimum: 1
          type: integer
      required:
        - productId
        - quantity
      type: object
    CreateProductBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateProductBody.json
          format: uri
          readOnly: true
          type: string
        minimumStock:
          default: 0
          description: The stock level at or below which the Product needs restocking. 0 when left out.
          format: int32
          minimum: 0
          type: integer
        name:
          description: The Product's name, in any language.
          maxLength: 120
          pattern: "[^\\t-\\r \x85   - \u2028\u2029  　]"
          patternDescription: contain a character that is not whitespace
          type: string
        price:
          description: What one unit sells for, in whole satang (฿1 = 100), from 0 to 999999999 (฿9,999,999.99).
          format: int64
          maximum: 999999999
          minimum: 0
          type: integer
        sku:
          description: Letters, digits and hyphens. No other Product may have it, in any letter case.
          maxLength: 40
          pattern: ^[A-Za-z0-9-]+$
          patternDescription: be letters, digits and hyphens only
          type: string
        unit:
          description: The word the Product is counted in, such as pcs or box.
          maxLength: 20
          pattern: "[^\\t-\\r \x85   - \u2028\u2029  　]"
          patternDescription: contain a character that is not whitespace
          type: string
      required:
        - name
        - sku
        - unit
        - price
      type: object
    CreateUserBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateUserBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Compared without regard to letter case; it cannot change afterwards.
          format: email
          type: string
        name:
          description: The User's name, in any language.
          pattern: "[^\\t-\\r \x85   - \u2028\u2029  　]"
          patternDescription: contain a character that is not whitespace
          type: string
        role:
          description: The Role of the new User. There is one Owner, and it is not made here.
          enum:
            - admin
            - staff
          type: string
      required:
        - name
        - email
        - role
      type: object
    CreateUserOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateUserOutputBody.json
          format: uri
          readOnly: true
          type: string
        setupLink:
          $ref: "#/components/schemas/SetupLink"
          description: How the new User sets their password (users-and-access R20, R28).
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - setupLink
      type: object
    CurrentUser:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CurrentUser.json
          format: uri
          readOnly: true
          type: string
        email:
          description: The User's email, as it was entered when the User was created.
          type: string
        name:
          description: The User's name, in any language.
          type: string
        role:
          description: The User's Role.
          enum:
            - owner
            - admin
            - staff
          type: string
      required:
        - name
        - email
        - role
      type: object
    DashboardOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DashboardOutputBody.json
          format: uri
          readOnly: true
          type: string
        lowProducts:
          description: How many Active Products are Low.
          format: int64
          type: integer
        newestOrders:
          description: The 5 newest Orders, newest first, as List Orders gives them.
          items:
            $ref: "#/components/schemas/OrderSummary"
          type: array
        ordersCompleted:
          description: How many Orders were completed today.
          format: int64
          type: integer
        outOfStockProducts:
          description: How many Active Products are Out of stock.
          format: int64
          type: integer
        pendingOrders:
          description: How many Orders are Pending now.
          format: int64
          type: integer
        restock:
          description: "Up to 10 Active Products that are Out of stock or Low: the Out of stock first, then the lowest stock."
          items:
            $ref: "#/components/schemas/RestockProduct"
          type: array
        sales:
          description: "Today's Sales: the totals of the Orders completed today, in whole satang."
          format: int64
          type: integer
        salesByDay:
          description: Sales for each of the last 14 days, today included, oldest first. A day with no Sales is 0.
          items:
            $ref: "#/components/schemas/SalesDay"
          type: array
        today:
          description: The day of the Shop the figures are for, in Bangkok time (YYYY-MM-DD).
          format: date
          type: string
      required:
        - today
        - sales
        - ordersCompleted
        - pendingOrders
        - lowProducts
        - outOfStockProducts
        - salesByDay
        - restock
        - newestOrders
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        products:
          description: "Only with insufficient-stock: each Product whose stock is too low for the change, with its stock."
          items:
            $ref: "#/components/schemas/ProductStock"
          type: array
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: |-
            The error's kind: about:blank for a plain HTTP error, or a domain error code.
            login-failed: The email and password did not log anyone in. Identical for every cause.
            session-ended: The request carried a session cookie that matches no live session.
            setup-link-invalid: The Setup link is used, expired, replaced or was never issued.
            email-taken: A User has this email already, in any letter case.
            target-is-owner: The operation acts on a User, and that User is the Owner, who cannot be changed here.
            user-inactive: No Setup link can be issued for an Inactive User.
            sku-taken: Another Product has this SKU, in any letter case.
            insufficient-stock: The stock change, or the Order, would take a Product's stock below 0. The error's products member names each such Product with its stock.
            product-archived: The Product is Archived: its stock cannot be received or adjusted, and it cannot be ordered.
            order-not-pending: The Order is completed or cancelled already, and neither can change.
          enum:
            - about:blank
            - login-failed
            - session-ended
            - setup-link-invalid
            - email-taken
            - target-is-owner
            - user-inactive
            - sku-taken
            - insufficient-stock
            - product-archived
            - order-not-pending
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Always "ok" when the API and its database answer.
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ListLoginLogOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListLoginLogOutputBody.json
          format: uri
          readOnly: true
          type: string
        entries:
          description: Newest first.
          items:
            $ref: "#/components/schemas/LoginLogEntryBody"
          type: array
        nextBefore:
          description: Pass as before for the next page. Null on the last page.
          format: int64
          type:
            - integer
            - "null"
        total:
          description: "Always present on numbered success: exact count for all current filters before offset/limit, including 0. Omitted in legacy cursor mode."
          format: int64
          minimum: 0
          type: integer
      required:
        - entries
        - nextBefore
      type: object
    ListOrdersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListOrdersOutputBody.json
          format: uri
          readOnly: true
          type: string
        orders:
          description: This page's Orders, newest first.
          items:
            $ref: "#/components/schemas/OrderSummary"
          type: array
        total:
          description: How many Orders match, whatever the page.
          format: int64
          type: integer
      required:
        - orders
        - total
      type: object
    ListProductsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListProductsOutputBody.json
          format: uri
          readOnly: true
          type: string
        products:
          description: This page's Products, sorted by name.
          items:
            $ref: "#/components/schemas/Product"
          type: array
        total:
          description: How many Products match, whatever the page.
          format: int64
          type: integer
      required:
        - products
        - total
      type: object
    ListStockMovementsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListStockMovementsOutputBody.json
          format: uri
          readOnly: true
          type: string
        movements:
          description: Newest first.
          items:
            $ref: "#/components/schemas/StockMovement"
          type: array
        nextBefore:
          description: Pass as before for the next page. Null on the last page.
          format: int64
          type:
            - integer
            - "null"
        total:
          description: "Always present on numbered success: exact count for all current filters before offset/limit, including 0. Omitted in legacy cursor mode."
          format: int64
          minimum: 0
          type: integer
      required:
        - movements
        - nextBefore
      type: object
    ListUsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListUsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        users:
          description: Every User, in the order they were created.
          items:
            $ref: "#/components/schemas/User"
          type: array
      required:
        - users
      type: object
    LogInInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LogInInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Compared without regard to letter case.
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    LoginLogEntryBody:
      additionalProperties: false
      properties:
        at:
          description: When it happened.
          format: date-time
          type: string
        email:
          description: What was entered, as it was typed, even when it matches no User. For a logout, the email of the User who logged out.
          type: string
        id:
          description: Identifies the entry. Later entries have higher ids.
          format: int64
          type: integer
        ip:
          description: The visitor's IP address.
          type: string
        result:
          description: A successful login, a failed login, or a logout.
          enum:
            - login
            - failed-login
            - logout
          type: string
        user:
          description: The User the email matches, or null when it matches none.
          oneOf:
            - $ref: "#/components/schemas/LoginLogUser"
            - type: "null"
        userAgent:
          description: The browser or device, as it called itself. Empty when it sent nothing.
          type: string
      required:
        - id
        - at
        - email
        - user
        - result
        - ip
        - userAgent
      type: object
    LoginLogUser:
      additionalProperties: false
      properties:
        id:
          description: Identifies the User.
          format: int64
          type: integer
        name:
          description: The User's name now.
          type: string
      required:
        - id
        - name
      type: object
    Order:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Order.json
          format: uri
          readOnly: true
          type: string
        cancelled:
          description: When and by whom it was cancelled, or null.
          oneOf:
            - $ref: "#/components/schemas/OrderFinish"
            - type: "null"
        completed:
          description: When and by whom it was completed, or null.
          oneOf:
            - $ref: "#/components/schemas/OrderFinish"
            - type: "null"
        createdAt:
          description: When it was created.
          format: date-time
          type: string
        createdBy:
          $ref: "#/components/schemas/OrderUser"
          description: The User who created it.
        customer:
          description: The customer's name, up to 120 characters. Empty when there is none.
          type: string
        id:
          description: Identifies the Order. A Stock movement made by it carries this id.
          format: int64
          type: integer
        lines:
          description: In the order they were given. A Product is on one line at most.
          items:
            $ref: "#/components/schemas/OrderLine"
          type: array
        note:
          description: Up to 200 characters. Empty when there is none.
          type: string
        number:
          description: "The Order's number: counting up from 1 in the order Orders are created, never reused. A refused Order may leave a gap."
          format: int64
          type: integer
        status:
          description: Pending until completed or cancelled; completed and cancelled are final.
          enum:
            - pending
            - completed
            - cancelled
          type: string
        total:
          description: The sum of the lines' amounts, in whole satang. There is no tax, discount or delivery charge.
          format: int64
          type: integer
      required:
        - id
        - number
        - createdAt
        - createdBy
        - customer
        - note
        - lines
        - total
        - status
        - completed
        - cancelled
      type: object
    OrderFinish:
      additionalProperties: false
      properties:
        at:
          description: When.
          format: date-time
          type: string
        by:
          $ref: "#/components/schemas/OrderUser"
          description: Who.
      required:
        - at
        - by
      type: object
    OrderLine:
      additionalProperties: false
      properties:
        amount:
          description: The quantity times the price, in whole satang.
          format: int64
          type: integer
        price:
          description: "What one unit sold for, in whole satang: the Product's price when the Order was created, which never changes after."
          format: int64
          type: integer
        product:
          $ref: "#/components/schemas/OrderLineProduct"
          description: The Product sold.
        quantity:
          description: "How many units: a whole number, at least 1."
          format: int32
          type: integer
      required:
        - product
        - quantity
        - price
        - amount
      type: object
    OrderLineProduct:
      additionalProperties: false
      properties:
        id:
          description: Identifies the Product.
          format: int64
          type: integer
        name:
          description: The Product's name now.
          type: string
        sku:
          description: The Product's SKU now.
          type: string
      required:
        - id
        - name
        - sku
      type: object
    OrderSummary:
      additionalProperties: false
      properties:
        createdAt:
          description: When it was created.
          format: date-time
          type: string
        customer:
          description: The customer's name. Empty when there is none.
          type: string
        id:
          description: Identifies the Order.
          format: int64
          type: integer
        lineCount:
          description: How many lines it has.
          format: int32
          type: integer
        number:
          description: The Order's number.
          format: int64
          type: integer
        status:
          description: Pending, completed or cancelled.
          enum:
            - pending
            - completed
            - cancelled
          type: string
        total:
          description: The sum of its lines' amounts, in whole satang.
          format: int64
          type: integer
      required:
        - id
        - number
        - createdAt
        - customer
        - lineCount
        - total
        - status
      type: object
    OrderUser:
      additionalProperties: false
      properties:
        id:
          description: Identifies the User.
          format: int64
          type: integer
        name:
          description: The User's name now.
          type: string
      required:
        - id
        - name
      type: object
    Product:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Product.json
          format: uri
          readOnly: true
          type: string
        id:
          description: Identifies the Product. It never changes.
          format: int64
          type: integer
        minimumStock:
          description: The stock level at or below which the Product needs restocking.
          format: int32
          type: integer
        name:
          description: The Product's name, in any language.
          type: string
        price:
          description: What one unit sells for, in whole satang (฿1 = 100), never a fraction.
          format: int64
          type: integer
        sku:
          description: The Product's SKU, as it was entered. No other Product has it, in any letter case.
          type: string
        status:
          description: An Archived Product is no longer sold but still exists, with its stock.
          enum:
            - active
            - archived
          type: string
        stock:
          description: How many units there are. It changes only through Stock movements.
          format: int32
          type: integer
        stockState:
          description: Out of stock when the stock is 0, low when it is above 0 and at or below the Minimum stock, in stock otherwise.
          enum:
            - in-stock
            - low
            - out-of-stock
          type: string
        unit:
          description: The word the Product is counted in, such as pcs or box.
          type: string
      required:
        - id
        - name
        - sku
        - unit
        - price
        - minimumStock
        - stock
        - stockState
        - status
      type: object
    ProductStock:
      additionalProperties: false
      properties:
        id:
          description: Identifies the Product.
          format: int64
          type: integer
        stock:
          description: "The Product's stock: how many units there are."
          format: int32
          type: integer
      required:
        - id
        - stock
      type: object
    ReadSetupLinkInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadSetupLinkInputBody.json
          format: uri
          readOnly: true
          type: string
        token:
          description: The token from the Setup link.
          type: string
      required:
        - token
      type: object
    ReadSetupLinkOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadSetupLinkOutputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: The email of the person the Setup link is for.
          type: string
        name:
          description: The name of the person the Setup link is for.
          type: string
      required:
        - name
        - email
      type: object
    ReceiveStockBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReceiveStockBody.json
          format: uri
          readOnly: true
          type: string
        note:
          description: Anything worth keeping about the delivery, up to 200 characters.
          maxLength: 200
          type: string
        productId:
          description: The Product received. It must be Active.
          format: int64
          type: integer
        quantity:
          description: "How many units arrived: a whole number, at least 1."
          format: int32
          minimum: 1
          type: integer
      required:
        - productId
        - quantity
      type: object
    ReportProduct:
      additionalProperties: false
      properties:
        id:
          description: Identifies the Product.
          format: int64
          type: integer
        name:
          description: The Product's name now.
          type: string
        quantitySold:
          description: How many units were sold in the range.
          format: int64
          type: integer
        sales:
          description: "What they sold for, in whole satang: the quantities times the prices of the Orders."
          format: int64
          type: integer
        sku:
          description: The Product's SKU now.
          type: string
      required:
        - id
        - name
        - sku
        - quantitySold
        - sales
      type: object
    RestockProduct:
      additionalProperties: false
      properties:
        id:
          description: Identifies the Product.
          format: int64
          type: integer
        minimumStock:
          description: The stock level at or below which the Product needs restocking.
          format: int32
          type: integer
        name:
          description: The Product's name.
          type: string
        sku:
          description: The Product's SKU.
          type: string
        stock:
          description: How many units there are.
          format: int32
          type: integer
        stockState:
          description: Out of stock when the stock is 0, low otherwise.
          enum:
            - low
            - out-of-stock
          type: string
        unit:
          description: The word the Product is counted in.
          type: string
      required:
        - id
        - name
        - sku
        - unit
        - stock
        - minimumStock
        - stockState
      type: object
    SalesDay:
      additionalProperties: false
      properties:
        date:
          description: A day of the Shop, in Bangkok time (YYYY-MM-DD).
          format: date
          type: string
        ordersCompleted:
          description: How many Orders were completed that day.
          format: int64
          type: integer
        sales:
          description: The totals of the Orders completed that day, in whole satang. 0 when there were none.
          format: int64
          type: integer
      required:
        - date
        - sales
        - ordersCompleted
      type: object
    SalesReportOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SalesReportOutputBody.json
          format: uri
          readOnly: true
          type: string
        averageSales:
          description: Sales per completed Order, in whole satang, rounded half up to the satang. 0 when no Order was completed.
          format: int64
          type: integer
        from:
          description: The first day of the range, as it was worked out (YYYY-MM-DD).
          format: date
          type: string
        ordersCompleted:
          description: How many Orders were completed in the range.
          format: int64
          type: integer
        sales:
          description: "Total Sales in the range: the totals of the Orders completed in it, in whole satang."
          format: int64
          type: integer
        salesByDay:
          description: Sales for each day of the range, oldest first. A day with no Sales is 0.
          items:
            $ref: "#/components/schemas/SalesDay"
          type: array
        to:
          description: The last day of the range, included.
          format: date
          type: string
        topProducts:
          description: Up to 20 Products with the highest Sales in the range, the highest first.
          items:
            $ref: "#/components/schemas/ReportProduct"
          type: array
      required:
        - from
        - to
        - sales
        - ordersCompleted
        - averageSales
        - salesByDay
        - topProducts
      type: object
    SetPasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetPasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: The new password, of at least 6 characters.
          minLength: 6
          type: string
        token:
          description: The token from the Setup link.
          type: string
      required:
        - token
        - password
      type: object
    SetupLink:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetupLink.json
          format: uri
          readOnly: true
          type: string
        expiresAt:
          description: When the Setup link stops working.
          format: date-time
          type: string
        token:
          description: "The Setup link's token. It is shown only this once: the API keeps a hash."
          type: string
      required:
        - token
        - expiresAt
      type: object
    StockMovement:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StockMovement.json
          format: uri
          readOnly: true
          type: string
        at:
          description: When it was made.
          format: date-time
          type: string
        change:
          description: "The change in stock: above 0 adds units, below 0 takes them. Never 0."
          format: int32
          type: integer
        id:
          description: Identifies the movement. Later movements have higher ids.
          format: int64
          type: integer
        kind:
          description: receive and adjustment are made on the Stock Movements page; order and cancellation by Orders.
          enum:
            - receive
            - adjustment
            - order
            - cancellation
          type: string
        note:
          description: Why, in up to 200 characters. Empty when there is none; an adjustment always has one.
          type: string
        order:
          description: The Order that made it, or null for receive and adjustment.
          oneOf:
            - $ref: "#/components/schemas/StockMovementOrder"
            - type: "null"
        product:
          $ref: "#/components/schemas/StockMovementProduct"
          description: The Product whose stock changed.
        stockAfter:
          description: The Product's stock just after this movement. Never below 0.
          format: int32
          type: integer
        user:
          $ref: "#/components/schemas/StockMovementUser"
          description: The User who made it.
      required:
        - id
        - at
        - kind
        - product
        - change
        - stockAfter
        - user
        - note
        - order
      type: object
    StockMovementOrder:
      additionalProperties: false
      properties:
        id:
          description: Identifies the Order.
          format: int64
          type: integer
        number:
          description: The Order's number.
          format: int64
          type: integer
      required:
        - id
        - number
      type: object
    StockMovementProduct:
      additionalProperties: false
      properties:
        id:
          description: Identifies the Product.
          format: int64
          type: integer
        name:
          description: The Product's name now.
          type: string
        sku:
          description: The Product's SKU now.
          type: string
      required:
        - id
        - name
        - sku
      type: object
    StockMovementUser:
      additionalProperties: false
      properties:
        id:
          description: Identifies the User.
          format: int64
          type: integer
        name:
          description: The User's name now.
          type: string
      required:
        - id
        - name
      type: object
    UpdateProductBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateProductBody.json
          format: uri
          readOnly: true
          type: string
        minimumStock:
          description: The stock level at or below which the Product needs restocking.
          format: int32
          minimum: 0
          type: integer
        name:
          description: The Product's name, in any language.
          maxLength: 120
          pattern: "[^\\t-\\r \x85   - \u2028\u2029  　]"
          patternDescription: contain a character that is not whitespace
          type: string
        price:
          description: What one unit sells for, in whole satang. A new price leaves every Order already created as it was.
          format: int64
          maximum: 999999999
          minimum: 0
          type: integer
        sku:
          description: Letters, digits and hyphens. No other Product may have it, in any letter case.
          maxLength: 40
          pattern: ^[A-Za-z0-9-]+$
          patternDescription: be letters, digits and hyphens only
          type: string
        status:
          description: Archived takes the Product out of the default list and keeps it, with its stock. Active restores it.
          enum:
            - active
            - archived
          type: string
        unit:
          description: The word the Product is counted in.
          maxLength: 20
          pattern: "[^\\t-\\r \x85   - \u2028\u2029  　]"
          patternDescription: contain a character that is not whitespace
          type: string
      type: object
    UpdateUserBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateUserBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: The User's name, in any language.
          pattern: "[^\\t-\\r \x85   - \u2028\u2029  　]"
          patternDescription: contain a character that is not whitespace
          type: string
        role:
          description: Applies at once to the sessions the User has open.
          enum:
            - admin
            - staff
          type: string
        status:
          description: Setting a User Inactive ends all their sessions and stops their Setup link. Setting them Active again brings back neither.
          enum:
            - active
            - inactive
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/User.json
          format: uri
          readOnly: true
          type: string
        email:
          description: As it was entered when the User was created. It never changes.
          type: string
        id:
          description: Identifies the User. It never changes.
          format: int64
          type: integer
        name:
          description: The User's name, in any language.
          type: string
        passwordSet:
          description: False until the person sets a password through a Setup link.
          type: boolean
        role:
          description: The User's Role.
          enum:
            - owner
            - admin
            - staff
          type: string
        status:
          description: An Inactive User cannot log in.
          enum:
            - active
            - inactive
          type: string
      required:
        - id
        - name
        - email
        - role
        - status
        - passwordSet
      type: object
  securitySchemes:
    session:
      in: cookie
      name: session
      type: apiKey
info:
  title: stock-flow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /dashboard:
    get:
      description: "How sales are going and what needs restocking, worked out from the Orders and Products when asked, on Bangkok days. Only Completed Orders are Sales. Owner and Admins only: answers 403 to Staff. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session."
      operationId: get-dashboard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Get the Dashboard
      tags:
        - Dashboard and reports
  /health:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Check that the API and its database answer
      tags:
        - Health
  /login:
    post:
      description: Starts a session. Every failure answers the same 401 `login-failed`, in the same time.
      operationId: create-session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
          description: OK
          headers:
            Set-Cookie:
              schema:
                description: Starts the session.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Log in with an email and a password
      tags:
        - Sessions
  /login-log:
    get:
      description: "Every login, failed login and logout, newest first, one page at a time. Entries cannot be changed or removed, and no operation does. Omit offset to preserve legacy cursor paging, including before/nextBefore and the default limit of 50. An explicitly supplied offset, including offset=0, selects numbered mode; offset and before together return 422. Numbered success includes a bounded page and total, always present and exact for all current filters before offset/limit, including total: 0 for no matches. An out-of-range page is empty with the actual matching total. total is omitted from legacy responses. During this contract-first stage, numbered mode temporarily returns 501; no numbered success or count is implemented yet. Authorization and validation run before this temporary response. Owner only: answers 403 to an Admin or Staff. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session."
      operationId: list-login-log
      parameters:
        - description: Only the entries of this User.
          explode: false
          in: query
          name: userId
          schema:
            description: Only the entries of this User.
            format: int64
            minimum: 1
            type: integer
        - description: Only the entries with this result.
          explode: false
          in: query
          name: result
          schema:
            description: Only the entries with this result.
            enum:
              - login
              - failed-login
              - logout
            type: string
        - description: "The previous page's nextBefore: only the entries older than that. Leave out for the newest."
          explode: false
          in: query
          name: before
          schema:
            description: "The previous page's nextBefore: only the entries older than that. Leave out for the newest."
            format: int64
            minimum: 1
            type: integer
        - description: Explicitly selects numbered mode, including 0. Omit for legacy cursor mode. Temporarily returns 501.
          explode: false
          in: query
          name: offset
          schema:
            description: Explicitly selects numbered mode, including 0. Omit for legacy cursor mode. Temporarily returns 501.
            format: int64
            maximum: 2147483647
            minimum: 0
            type: integer
        - description: The most entries on a page.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: The most entries on a page.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLoginLogOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      security:
        - session: []
      summary: List the Login log
      tags:
        - Login log
  /logout:
    post:
      description: The User's sessions on other devices stay live. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: end-session
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                description: Removes the session cookie.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: End this device's session
      tags:
        - Sessions
  /me:
    get:
      description: Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: get-current-user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Get the User who is logged in
      tags:
        - Sessions
  /orders:
    get:
      description: Every Role sees every Order, newest first, one page at a time. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: list-orders
      parameters:
        - description: Only the Order with this number, and the Orders whose customer contains this text in any letter case. Leave out, or leave blank, for all.
          explode: false
          in: query
          name: search
          schema:
            description: Only the Order with this number, and the Orders whose customer contains this text in any letter case. Leave out, or leave blank, for all.
            type: string
        - description: Only the Orders with this status. Leave out for all.
          explode: false
          in: query
          name: status
          schema:
            description: Only the Orders with this status. Leave out for all.
            enum:
              - pending
              - completed
              - cancelled
            type: string
        - description: The most Orders on a page.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: The most Orders on a page.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: How many matching Orders to skip, to reach a later page.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: How many matching Orders to skip, to reach a later page.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOrdersOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: List the Orders
      tags:
        - Orders
    post:
      description: "Every Role may. The Order starts pending, and each line's quantity leaves its Product's stock at once, as one order movement per line. It is created whole or not at all: 409 `insufficient-stock` when any line asks for more than its Product's stock, naming each such Product with its stock; 409 `product-archived` when a Product is Archived; a plain 404 when there is no such Product; and 422 for a Product on two lines or a total past 9223372036854775807. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session."
      operationId: create-order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Create an Order
      tags:
        - Orders
  /orders/{number}:
    get:
      description: Every Role sees every Order, with its lines. Answers a plain 404 when there is no such Order. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: get-order
      parameters:
        - description: The Order's number.
          in: path
          name: number
          required: true
          schema:
            description: The Order's number.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Get an Order
      tags:
        - Orders
  /orders/{number}/cancel:
    post:
      description: "Records who cancelled it and when, and gives each line's quantity back to its Product's stock as one cancellation movement per line, even to a Product Archived since. Answers 409 `order-not-pending` when it is completed or cancelled already, and a plain 409 when giving the stock back would take it past 2147483647. Answers a plain 404 when there is no such Order. Owner and Admins only: answers 403 to Staff. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session."
      operationId: cancel-order
      parameters:
        - description: The Order's number.
          in: path
          name: number
          required: true
          schema:
            description: The Order's number.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Cancel an Order
      tags:
        - Orders
  /orders/{number}/complete:
    post:
      description: Every Role may, once the customer has paid and has the goods. Records who completed it and when; no stock changes. Answers 409 `order-not-pending` when it is completed or cancelled already. Answers a plain 404 when there is no such Order. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: complete-order
      parameters:
        - description: The Order's number.
          in: path
          name: number
          required: true
          schema:
            description: The Order's number.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Complete an Order
      tags:
        - Orders
  /products:
    get:
      description: Every Role sees the same list, prices included. Sorted by name, one page at a time. Shows the Active Products unless `status` asks for the Archived ones. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: list-products
      parameters:
        - description: Only the Products whose name or SKU contains this text, in any letter case. Leave out, or leave blank, for all.
          explode: false
          in: query
          name: search
          schema:
            description: Only the Products whose name or SKU contains this text, in any letter case. Leave out, or leave blank, for all.
            type: string
        - description: "Only the Products in one of these stock states. Repeat it to name several: stock=low&stock=out-of-stock. Leave out for all."
          explode: true
          in: query
          name: stock
          schema:
            description: "Only the Products in one of these stock states. Repeat it to name several: stock=low&stock=out-of-stock. Leave out for all."
            items:
              enum:
                - in-stock
                - low
                - out-of-stock
              type: string
            type:
              - array
              - "null"
        - description: Only the Products with this status.
          explode: false
          in: query
          name: status
          schema:
            default: active
            description: Only the Products with this status.
            enum:
              - active
              - archived
            type: string
        - description: The most Products on a page.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: The most Products on a page.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: How many matching Products to skip, to reach a later page.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
