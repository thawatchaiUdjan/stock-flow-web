  /stock-movements:
    get:
      description: "Every Role sees every Stock movement, newest first, one page at a time. No operation changes or removes one. Omit offset to preserve legacy cursor paging, including before/nextBefore and the default limit of 50. An explicitly supplied offset, including offset=0, selects numbered mode; offset and before together return 422. Numbered success includes a bounded page and total, always present and exact for all current filters before offset/limit, including total: 0 for no matches. An out-of-range page is empty with the actual matching total. total is omitted from legacy responses. During this contract-first stage, numbered mode temporarily returns 501; no numbered success or count is implemented yet. Authorization and validation run before this temporary response. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session."
      operationId: list-stock-movements
      parameters:
        - description: Only the movements of this Product.
          explode: false
          in: query
          name: productId
          schema:
            description: Only the movements of this Product.
            format: int64
            minimum: 1
            type: integer
        - description: Only the movements of this kind.
          explode: false
          in: query
          name: kind
          schema:
            description: Only the movements of this kind.
            enum:
              - receive
              - adjustment
              - order
              - cancellation
            type: string
        - description: Only the movements on or after this day of the Shop, in Bangkok time (YYYY-MM-DD).
          explode: false
          in: query
          name: from
          schema:
            description: Only the movements on or after this day of the Shop, in Bangkok time (YYYY-MM-DD).
            format: date
            type: string
        - description: Only the movements on or before this day of the Shop, in Bangkok time (YYYY-MM-DD).
          explode: false
          in: query
          name: to
          schema:
            description: Only the movements on or before this day of the Shop, in Bangkok time (YYYY-MM-DD).
            format: date
            type: string
        - description: "The previous page's nextBefore: only the movements older than that. Leave out for the newest."
          explode: false
          in: query
          name: before
          schema:
            description: "The previous page's nextBefore: only the movements older than that. Leave out for the newest."
            format: int64
            minimum: 1
            type: integer
        - description: Explicitly selects numbered mode, including 0. Omit for legacy cursor mode. Temporarily returns 501.
          explode: false
          in: query
          name: offset
          schema:
            description: Explicitly selects numbered mode, including 0. Omit for legacy cursor mode. Temporarily returns 501.
            format: int64
            maximum: 2147483647
            minimum: 0
            type: integer
        - description: The most movements on a page.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: The most movements on a page.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStockMovementsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      security:
        - session: []
      summary: List the Stock movements
      tags:
        - Stock movements
  /stock-movements/adjust:
    post:
      description: "Corrects a Product's stock up or down, as an adjustment movement with a note saying why. Answers 409 `insufficient-stock` when it would take the stock below 0, naming the stock there is. Answers a plain 404 when there is no such Product, 409 `product-archived` when it is Archived, and 422 when the stock would grow past 2147483647. Owner and Admins only: answers 403 to Staff. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session."
