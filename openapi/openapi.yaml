components:
  schemas:
    CurrentUser:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CurrentUser.json
          format: uri
          readOnly: true
          type: string
        email:
          description: The User's email, as it was entered when the User was created.
          type: string
        name:
          description: The User's name, in any language.
          type: string
        role:
          description: The User's Role.
          enum:
            - owner
            - admin
            - staff
          type: string
      required:
        - name
        - email
        - role
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: |-
            The error's kind: about:blank for a plain HTTP error, or a domain error code.
            login-failed: The email and password did not log anyone in. Identical for every cause.
            session-ended: The request carried a session cookie that matches no live session.
            setup-link-invalid: The Setup link is used, expired, replaced or was never issued.
          enum:
            - about:blank
            - login-failed
            - session-ended
            - setup-link-invalid
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Always "ok" when the API and its database answer.
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    LogInInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LogInInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Compared without regard to letter case.
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    ReadSetupLinkInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadSetupLinkInputBody.json
          format: uri
          readOnly: true
          type: string
        token:
          description: The token from the Setup link.
          type: string
      required:
        - token
      type: object
    ReadSetupLinkOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadSetupLinkOutputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: The email of the person the Setup link is for.
          type: string
        name:
          description: The name of the person the Setup link is for.
          type: string
      required:
        - name
        - email
      type: object
    SetPasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetPasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: The new password, of at least 6 characters.
          minLength: 6
          type: string
        token:
          description: The token from the Setup link.
          type: string
      required:
        - token
        - password
      type: object
  securitySchemes:
    session:
      in: cookie
      name: session
      type: apiKey
info:
  title: stock-flow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Check that the API and its database answer
      tags:
        - Health
  /login:
    post:
      description: Starts a session. Every failure answers the same 401 `login-failed`, in the same time.
      operationId: create-session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
          description: OK
          headers:
            Set-Cookie:
              schema:
                description: Starts the session.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Log in with an email and a password
      tags:
        - Sessions
  /logout:
    post:
      description: The User's sessions on other devices stay live. Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: end-session
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                description: Removes the session cookie.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: End this device's session
      tags:
        - Sessions
  /me:
    get:
      description: Answers a plain 401 with no session cookie, and 401 `session-ended` with a cookie that matches no live session.
      operationId: get-current-user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Get the User who is logged in
      tags:
        - Sessions
  /setup-link/password:
    post:
      description: "Uses up the Setup link. It starts no session: the person logs in next. Answers 410 `setup-link-invalid` when the Setup link is used, expired or replaced."
      operationId: set-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Set a password through a Setup link
      tags:
        - Setup links
  /setup-link/read:
    post:
      description: Answers 410 `setup-link-invalid` when the Setup link is used, expired or replaced.
      operationId: read-setup-link
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadSetupLinkInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadSetupLinkOutputBody"
          description: OK
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Read who a Setup link is for
      tags:
        - Setup links
